<!DOCTYPE html>
<html lang="et">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/skeleton.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/classic/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/classic/palette.css">

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/classic/global.js"></script>
  <!-- eestikeelsed nädalapäevad ja kuud -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/locales/et/global.js"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: 'Montserrat', sans-serif;
      background: white;
    }

    /* ---------- TOPBAR ---------- */
    .topbar {
      position: relative;
      width: 100%;
      max-width: 1500px;
      height: 60px;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #e5e5e5;
    }

    .topbar-title {
      font-size: 24px;
      font-weight: 700;
      color: #34495e;
    }

    .logout-button {
      position: absolute;
      right: 0;
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      background: #34495e;
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
    }

    .logout-button:hover {
      background: #263746;
    }

    /* ---------- LAYOUT: to do vasakul, kalender paremal ---------- */
    .layout {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
    }

    #calendar {
      flex: 1;
      min-width: 0;
    }

    /* ---------- TO DO PANEL ---------- */
    .todo-panel {
      width: 260px;
      flex-shrink: 0;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      padding: 15px;
      box-sizing: border-box;
    }

    .todo-panel h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      color: #34495e;
    }

    .todo-panel hr {
      border: none;
      border-top: 1px solid #e5e5e5;
      margin: 20px 0 16px 0;
    }

    .todo-form {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .todo-form input,
    .todo-form select {
      width: 100%;
      box-sizing: border-box;
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      background: white;
    }

    .todo-form .busy-repeat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #34495e;
      cursor: pointer;
    }

    .todo-form .busy-repeat input {
      width: auto;
      margin: 0;
    }

    .todo-datetime {
      display: flex;
      gap: 6px;
    }

    .todo-datetime input {
      flex: 1;
    }

    .todo-form button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: #34495e;
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
    }

    .todo-form button:hover {
      background: #263746;
    }

    #todo-list,
    #busy-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #todo-list li,
    #busy-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
    }

    #todo-list li input[type="checkbox"] {
      margin-top: 2px;
    }

    #todo-list li .todo-body,
    #busy-list li .todo-body {
      flex: 1;
      min-width: 0;
    }

    #todo-list li .todo-text,
    #busy-list li .todo-text {
      display: block;
      word-break: break-word;
    }

    #todo-list li .todo-when,
    #busy-list li .todo-when {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      color: #78909c;
    }

    #todo-list li.done .todo-text {
      text-decoration: line-through;
      color: #aaa;
    }

    #todo-list li .delete,
    #busy-list li .delete {
      border: none;
      background: none;
      color: #c0392b;
      font-size: 16px;
      cursor: pointer;
    }

    /* tehtud ülesanded kalendris */
    .todo-done,
    .todo-done * {
      text-decoration: line-through !important;
    }

    .todo-done {
      opacity: 0.5;
    }

    /* ---------- FULLCALENDAR ---------- */
    .fc-toolbar-title {
      font-size: 24px !important;
      font-weight: bold;
    }

    .fc-header-toolbar {
      margin-bottom: 10px !important;
    }

    .fc-button {
      border-radius: 4px !important;
      box-shadow: none !important;
      font-size: 13px !important;
    }

    .fc-today-button {
      background: #78909c !important;
      border-color: #78909c !important;
      color: white !important;
    }

    .fc-prev-button,
    .fc-next-button {
      background: #34495e !important;
      border-color: #34495e !important;
      color: white !important;
    }

    .fc-prev-button:hover,
    .fc-next-button:hover {
      background: #263746 !important;
    }

    .fc-col-header-cell {
      background: #fafafa;
      font-weight: bold;
      font-size: 13px;
      padding: 5px 0 !important;
    }

    .fc-daygrid-day {
      background: white;
      min-height: 100px;
    }

    .fc-scrollgrid,
    .fc-scrollgrid td,
    .fc-scrollgrid th {
      border-color: #e5e5e5 !important;
    }

    .fc-daygrid-day-number {
      font-size: 13px;
      color: #333;
      padding: 5px 7px !important;
    }

    .fc-day-today {
      background: #fffde7 !important;
    }

    .fc-day-other .fc-daygrid-day-number {
      color: #aaa;
    }

    .fc-event {
      border-radius: 3px;
      padding: 2px 4px;
      font-size: 12px;
    }

    /* hõivatud aeg (tunniplaan): värv tuleb kasutaja valikust */
    .busy-event {
      opacity: 0.9;
    }

    /* ---------- LÄHIAJA TEATED (kast all vasakul) ---------- */
    .upcoming {
      position: fixed;
      left: 12px;
      bottom: 12px;
      width: 280px;
      max-width: calc(100vw - 24px);
      box-sizing: border-box;
      padding: 10px 12px;
      background: white;
      border: 1px solid #e5e5e5;
      border-left: 4px solid #34495e;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      font-size: 13px;
      z-index: 900;
    }

    .upcoming[hidden] {
      display: none;
    }

    .upcoming-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      color: #34495e;
    }

    .upcoming-head button {
      padding: 0 4px;
      border: none;
      background: none;
      color: #78909c;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .upcoming.collapsed .upcoming-head {
      margin-bottom: 0;
    }

    .upcoming.collapsed #upcoming-list {
      display: none;
    }

    #upcoming-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 40vh;
      overflow-y: auto;
    }

    #upcoming-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px;
      border-top: 1px solid #f0f0f0;
    }

    #upcoming-list li.soon {
      background: #fffde7;
      border-radius: 4px;
    }

    #upcoming-list li.soon .upcoming-text {
      font-weight: 600;
    }

    #upcoming-list li.more {
      color: #78909c;
      font-size: 12px;
    }

    .upcoming-body {
      flex: 1;
      min-width: 0;
    }

    .upcoming-text {
      display: block;
      word-break: break-word;
    }

    .upcoming-when {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      color: #78909c;
    }

    /* telefon: kast ei ole enam ekraani küljes, vaid lehe lõpus, et see ei kataks To do paneeli */
    @media (max-width: 800px) {
      .upcoming {
        position: static;
        width: auto;
        max-width: 600px;
        margin: 14px auto 0 auto;
      }
    }

    /* vigane kellaaeg */
    input.time24.invalid {
      border-color: #c0392b;
      background: #fdecea;
    }

    /* ---------- VÄRVIVALIK ---------- */
    .color-picker {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-picker .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      flex: 1;
    }

    .color-picker .swatch {
      width: 20px;
      height: 20px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 50%;
      cursor: pointer;
    }

    .color-picker .swatch.selected {
      border-color: #34495e;
      box-shadow: 0 0 0 2px white inset;
    }

    .todo-form .color-picker input[type="color"] {
      width: 32px;
      height: 28px;
      padding: 0;
      border: 1px solid #ccc;
      cursor: pointer;
      flex-shrink: 0;
    }

    .color-dot {
      width: 10px;
      height: 10px;
      margin-top: 4px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ---------- LAIAD EKRAANID: kalender täpselt keskel, to do selle vasakul ---------- */
    @media (min-width: 1850px) {
      .topbar {
        max-width: 1250px;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr minmax(0, 1250px) 1fr;
        max-width: none;
      }

      .todo-panel {
        grid-column: 1;
        justify-self: end;
      }

      #calendar {
        grid-column: 2;
      }
    }

    /* ---------- TELEFON: to do kalendri kohale ---------- */
    @media (max-width: 800px) {
      .layout {
        flex-direction: column;
      }

      .todo-panel {
        width: 100%;
      }

      #calendar {
        width: 100%;
      }
    }

    /* ---------- LISTID: ei veni lõputult pikaks, kerivad ---------- */
    #todo-list,
    #busy-list {
      max-height: 230px;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
    }

    #todo-list li.clickable,
    #busy-list li.clickable {
      cursor: pointer;
    }

    #todo-list li.clickable:hover,
    #busy-list li.clickable:hover {
      background: #f7f9fa;
    }

    .todo-form[hidden] {
      display: none;
    }

    .weekday-hint {
      margin-top: -2px;
      font-size: 11px;
      color: #78909c;
    }

    .weekday-hint[hidden] {
      display: none;
    }

    @media (min-width: 801px) {
      body.has-upcoming {
        padding-bottom: 200px;      /* et teadete kast ei kataks lehe alumist osa */
      }
    }

    /* ---------- MUUTMISE AKEN ---------- */
    #edit .modal-box {
      width: 320px;
      max-width: calc(100vw - 32px);
      max-height: 90vh;
      overflow-y: auto;
      box-sizing: border-box;
    }

    #edit .todo-form {
      margin-bottom: 0;
    }

    #edit .modal-box .todo-form input[type="checkbox"] {
      padding: 0;
    }

    #edit .modal-buttons .modal-delete {
      margin-right: auto;
      background: #c0392b;
    }

    .edit-error {
      color: #c0392b;
      font-size: 12px;
    }

    .edit-error:empty {
      display: none;
    }

    /* ---------- AKEN (modal) ---------- */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal[hidden] {
      display: none;
    }

    .modal-box {
      background: white;
      padding: 20px;
      border-radius: 6px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-family: 'Montserrat', sans-serif;
    }

    .modal-box h3 {
      margin: 0;
      color: #34495e;
      font-size: 16px;
    }

    .modal-box input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-buttons button {
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      background: #34495e;
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      cursor: pointer;
    }

    .modal-buttons .modal-cancel {
      background: #aaa;
    }
  </style>
</head>

<body>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h3 id="modal-title">Uus ülesanne</h3>
      <input type="text" id="modal-text" placeholder="Ülesande nimi...">
      <input type="text" id="modal-time" class="time24" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="Kellaaeg TT:MM">
      <div class="modal-buttons">
        <button id="modal-cancel" class="modal-cancel">Tühista</button>
        <button id="modal-save">Lisa</button>
      </div>
    </div>
  </div>

  <!-- Muutmise aken: vajuta ülesandel või hõivatud ajal (listis või kalendris) -->
  <div id="edit" class="modal" hidden>
    <div class="modal-box">
      <h3 id="edit-title">Muuda</h3>

      <div class="todo-form">
        <input type="text" id="edit-text" maxlength="100" placeholder="Nimi...">

        <div id="edit-todo-fields" class="todo-form">
          <div class="todo-datetime">
            <input type="date" id="edit-date">
            <input type="text" id="edit-time" class="time24" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="TT:MM" title="Kellaaeg 24 tunni süsteemis, nt 14:30">
          </div>
          <div class="weekday-hint" id="edit-weekday"></div>
          <div class="color-picker" id="edit-todo-color-picker">
            <div class="swatches"></div>
            <input type="color" id="edit-todo-color" value="#3788d8" title="Oma värv">
          </div>
        </div>

        <div id="edit-busy-fields" class="todo-form" hidden>
          <label class="busy-repeat">
            <input type="checkbox" id="edit-repeat"> Kordub igal nädalal
          </label>
          <select id="edit-day">
            <option value="1">Esmaspäev</option>
            <option value="2">Teisipäev</option>
            <option value="3">Kolmapäev</option>
            <option value="4">Neljapäev</option>
            <option value="5">Reede</option>
            <option value="6">Laupäev</option>
            <option value="0">Pühapäev</option>
          </select>
          <input type="date" id="edit-busy-date" hidden>
          <div class="todo-datetime">
            <input type="text" id="edit-start" class="time24" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="Algus TT:MM" title="Algus 24 tunni süsteemis, nt 08:00">
            <input type="text" id="edit-end" class="time24" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="Lõpp TT:MM" title="Lõpp 24 tunni süsteemis, nt 09:30">
          </div>
          <div class="color-picker" id="edit-busy-color-picker">
            <div class="swatches"></div>
            <input type="color" id="edit-busy-color" value="#b0bec5" title="Oma värv">
          </div>
        </div>

        <div class="edit-error" id="edit-error"></div>
      </div>

      <div class="modal-buttons">
        <button type="button" id="edit-delete" class="modal-delete">Kustuta</button>
        <button type="button" id="edit-cancel" class="modal-cancel">Tühista</button>
        <button type="button" id="edit-save">Salvesta</button>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-title">TODO</div>

    <button class="logout-button" onclick="window.location.href='/logout'">
      Log out
    </button>
  </header>

  <div class="layout">

    <aside class="todo-panel">
      <h2 id="todo-heading">To do</h2>

      <div class="todo-form">
        <input type="text" id="todo-text" placeholder="Lisa ülesanne...">

        <div class="todo-datetime">
          <input type="date" id="todo-date">
          <input type="text" id="todo-time" class="time24" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="TT:MM" title="Kellaaeg 24 tunni süsteemis, nt 14:30">
        </div>
        <div class="weekday-hint" id="todo-weekday"></div>

        <div class="color-picker" id="todo-color-picker">
          <div class="swatches"></div>
          <input type="color" id="todo-color" value="#3788d8" title="Oma värv">
        </div>

        <button id="todo-add">Lisa</button>
      </div>

      <ul id="todo-list"></ul>

      <!-- ---------- HÕIVATUD AEG (tunniplaan) ---------- -->
      <hr>
      <h2>Hõivatud aeg</h2>

      <div class="todo-form">
        <input type="text" id="busy-text" placeholder="nt Matemaatika">

        <label class="busy-repeat">
          <input type="checkbox" id="busy-repeat" checked> Kordub igal nädalal
        </label>

        <select id="busy-day">
          <option value="1">Esmaspäev</option>
          <option value="2">Teisipäev</option>
          <option value="3">Kolmapäev</option>
          <option value="4">Neljapäev</option>
          <option value="5">Reede</option>
          <option value="6">Laupäev</option>
          <option value="0">Pühapäev</option>
        </select>
        <input type="date" id="busy-date" hidden>
        <div class="weekday-hint" id="busy-weekday" hidden></div>

        <div class="todo-datetime">
          <input type="text" id="busy-start" class="time24" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="Algus TT:MM" title="Algus 24 tunni süsteemis, nt 08:00">
          <input type="text" id="busy-end" class="time24" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="Lõpp TT:MM" title="Lõpp 24 tunni süsteemis, nt 09:30">
        </div>

        <div class="color-picker" id="busy-color-picker">
          <div class="swatches"></div>
          <input type="color" id="busy-color" value="#b0bec5" title="Oma värv">
        </div>

        <button id="busy-add">Lisa hõivatud aeg</button>
      </div>

      <ul id="busy-list"></ul>
    </aside>

    <div id="calendar"></div>

  </div>

  <!-- Lähiaja teated: ülesanded ja hõivatud ajad järgmise 24 tunni jooksul -->
  <aside id="upcoming" class="upcoming" hidden>
    <div class="upcoming-head">
      <strong id="upcoming-title">Lähiajal</strong>
      <button type="button" id="upcoming-toggle" title="Peida / näita">–</button>
    </div>
    <ul id="upcoming-list"></ul>
  </aside>

  <script>
    const CSRF = document.querySelector('meta[name="csrf-token"]').content;

    // ---------- SERVERIGA SUHTLUS ----------
    async function api(url, method, body) {
      const res = await fetch(url, {
        method: method,
        headers: {
          "Content-Type": "application/json",
          "X-CSRF-Token": CSRF
        },
        body: body ? JSON.stringify(body) : undefined
      });
      if (res.status === 401) {
        window.location.href = "/";
        throw new Error("Pole sisse logitud");
      }
      if (!res.ok) throw new Error("Viga: " + res.status);
      return res.json();
    }

    // ---------- 24-TUNNI KELLAAJA VÄLJAD ----------
    // <input type="time"> näitab AM/PM, kui brauser või arvuti on inglise keeles.
    // Seepärast on kellaaja väljad tavalised tekstiväljad, kuhu kirjutatakse TT:MM.

    // "930" / "9:30" / "9.30" / "14" -> "09:30" / "09:30" / "09:30" / "14:00".
    // Tühi -> "". Vigane (nt "25:00") -> null.
    function normalizeTime(raw) {
      raw = String(raw || "").trim().replace(/[:.]$/, "");   // "12:" -> "12"
      if (raw === "") return "";
      let h, m, match;
      if ((match = raw.match(/^(\d{1,2})[:.](\d{1,2})$/))) {
        h = Number(match[1]); m = Number(match[2]);
      } else if ((match = raw.match(/^(\d{3,4})$/))) {
        const digits = match[1].padStart(4, "0");
        h = Number(digits.slice(0, 2)); m = Number(digits.slice(2));
      } else if ((match = raw.match(/^(\d{1,2})$/))) {
        h = Number(match[1]); m = 0;
      } else {
        return null;
      }
      if (h > 23 || m > 59) return null;
      return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    }

    // Loeb välja väärtuse: "HH:MM", "" (tühi) või null (vigane)
    function readTime(input) {
      return normalizeTime(input.value);
    }

    function setupTimeInput(input) {
      input.addEventListener("input", function (e) {
        let v = input.value.replace(/[^\d:.]/g, "");
        // pärast kehtivat tundi (00-23) lisa kooloni automaatselt (ainult kirjutades, mitte kustutades);
        // "93" ei saa olla tund, nii et "930" jääb kirjutamise ajal puutumata ja saab hiljem 09:30
        if (e.inputType && e.inputType.indexOf("insert") === 0 && /^\d{2}$/.test(v) && Number(v) <= 23) v += ":";
        input.value = v.slice(0, 5);
        input.classList.remove("invalid");
      });
      input.addEventListener("blur", function () {
        const t = normalizeTime(input.value);
        if (t === null) {
          input.classList.add("invalid");
        } else {
          input.value = t;
          input.classList.remove("invalid");
        }
      });
    }
    document.querySelectorAll("input.time24").forEach(setupTimeInput);

    // ---------- VÄRVID ----------
    const DEFAULT_TODO_COLOR = "#3788d8";
    const DEFAULT_BUSY_COLOR = "#b0bec5";
    const TODO_PALETTE = ["#3788d8", "#e74c3c", "#27ae60", "#f39c12", "#8e44ad", "#16a085", "#e91e63", "#795548"];
    const BUSY_PALETTE = ["#b0bec5", "#90caf9", "#a5d6a7", "#ffe082", "#ef9a9a", "#ce93d8", "#80cbc4", "#bcaaa4"];

    // Lubab ainult kujul #rrggbb, kõik muu läheb vaikevärviks
    function safeColor(value, fallback) {
      return /^#[0-9a-fA-F]{6}$/.test(value || "") ? value.toLowerCase() : fallback;
    }

    // Tume tekst heleda värvi peal, valge tekst tumeda värvi peal
    function textColorFor(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? "#263746" : "#ffffff";
    }

    // Kalendri sündmuse värviväljad (FullCalendar 7: color ja contrastColor)
    function colorProps(value, fallback) {
      const color = safeColor(value, fallback);
      return { color: color, contrastColor: textColorFor(color) };
    }

    // Kui server värvi tagasi ei saada, kasutame valitud värvi (kuni lehe värskendamiseni)
    function withColor(item, sentColor) {
      if (!item.color) {
        console.warn("Server ei salvestanud värvi. Lisa backendis 'color' väli, muidu kaob värv lehe värskendamisel.");
        item.color = sentColor;
      }
      return item;
    }

    // Värviruudud + vabalt valitav värv
    function setupColorPicker(pickerId, inputId, palette) {
      const swatches = document.getElementById(pickerId).querySelector(".swatches");
      const input = document.getElementById(inputId);

      function mark() {
        swatches.querySelectorAll(".swatch").forEach(function (btn) {
          btn.classList.toggle("selected", btn.dataset.color === input.value.toLowerCase());
        });
      }

      palette.forEach(function (color) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "swatch";
        btn.dataset.color = color;
        btn.style.background = color;
        btn.title = color;
        btn.onclick = function () { input.value = color; mark(); };
        swatches.appendChild(btn);
      });

      input.addEventListener("input", mark);
      mark();
      return input;
    }

    // ---------- EESTI NÄDALAPÄEVAD ----------
    // getDay(): 0 = pühapäev ... 6 = laupäev. Nädal algab esmaspäevast: 1,2,3,4,5,6,0
    const WD_ABBR = { 1: "Esm", 2: "Tei", 3: "Kol", 4: "Nel", 5: "Ree", 6: "Lau", 0: "Püh" };
    const WD_FULL = { 1: "esmaspäev", 2: "teisipäev", 3: "kolmapäev", 4: "neljapäev", 5: "reede", 6: "laupäev", 0: "pühapäev" };

    function weekdayOf(dateStr) {
      return new Date(dateStr + "T00:00:00").getDay();
    }

    // Hõivatud aeg on ühekordne, kui repeat on false. Kui server repeat-välja ei salvesta,
    // aga kuupäev on olemas, loeme selle samuti ühekordseks.
    function isOneOff(b) {
      return b.repeat === false || (b.repeat == null && !!b.date);
    }

    // ---------- ANDMED ----------
    let todos = [];
    let busy = [];                  // hõivatud aja blokid (tunniplaan)
    let modalDate = "";

    function todosToEvents() {
      return todos
        .filter(t => t.date)
        .map(t => ({
          id: t.id,
          title: t.text,
          start: t.time ? t.date + "T" + t.time : t.date,
          allDay: !t.time,
          ...colorProps(t.color, DEFAULT_TODO_COLOR),
          extendedProps: { done: t.done, busyRank: 0 }
        }));
    }

    // hõivatud aeg: kas kordub igal nädalal või on ühekordne (kindel kuupäev)
    function busyToEvents() {
      return busy.map(b => {
        const base = {
          id: "busy-" + b.id,
          title: b.text,
          className: "busy-event",
          editable: false,
          ...colorProps(b.color, DEFAULT_BUSY_COLOR),
          extendedProps: { busyRank: 1 }
        };
        if (isOneOff(b)) {
          return { ...base, start: b.date + "T" + b.start, end: b.date + "T" + b.end };
        }
        return { ...base, daysOfWeek: [b.day], startTime: b.start, endTime: b.end };
      });
    }

    // ---------- KALENDER ----------
    let viewDate = "";                  // tühi = kuuvaade/nädalavaade, muidu avatud päev (YYYY-MM-DD)
    let viewType = "dayGridMonth";      // praegune vaade
    var ready = false;                  // muutub true, kui leht on täielikult laetud

    let calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
      initialView: "dayGridMonth",

      headerToolbar: {
        left: "title",
        center: "",
        right: "dayGridMonth timeGridWeek today prev,next"
      },

      // nuppude tekstid eesti keeles (FullCalendar 7-s on buttonText asemel "buttons")
      buttons: {
        today: { text: "Täna" },
        dayGridMonth: { text: "Kuu" },
        timeGridWeek: { text: "Nädal" }
      },

      // 24-tunni kellaaeg (FullCalendar 7-s on ajatelje sildi seade slotHeaderFormat,
      // vana nimi slotLabelFormat enam ei tööta)
      slotHeaderFormat: { hour: "2-digit", minute: "2-digit", hour12: false, omitZeroMinute: false },
      eventTimeFormat: { hour: "2-digit", minute: "2-digit", hour12: false },
      allDayText: "Terve päev",

      locale: "et",
      weekends: true,
      firstDay: 1,                      // nädal algab esmaspäevaga ja lõpeb pühapäevaga
      displayEventEnd: false,

      // kuuvaates rohkem kui 4 sündmust -> "+ veel" link
      dayMaxEvents: 4,
      // ülesanded enne tunniplaani
      eventOrder: ["busyRank", "start", "-duration", "allDay", "title"],

      // terve ööpäev: 00:00 kuni 24:00
      slotMinTime: "00:00:00",
      slotMaxTime: "24:00:00",
      scrollTime: "08:00:00",
      nowIndicator: true,

      eventClass: function (data) {
        const props = data.event.extendedProps || {};
        return props.done ? "todo-done" : "";
      },

      events: function (info, successCallback) {
        successCallback(todosToEvents().concat(busyToEvents()));
      },

      // vajuta sündmusel -> muuda seda
      eventClick: function (info) {
        const id = String(info.event.id);
        if (id.indexOf("busy-") === 0) openEdit("busy", id.slice(5));
        else openEdit("todo", id);
      },

      dateClick: function (info) {
        const dateStr = info.dateStr.slice(0, 10);

        if (info.view.type === "dayGridMonth") {
          calendar.changeView("timeGridDay", dateStr);
        } else {
          todoDate.value = dateStr;
          todoTime.value = info.dateStr.length > 10 ? info.dateStr.slice(11, 16) : "";
          updateHints();
          todoInput.focus();
        }
      },

      datesSet: function (info) {
        viewType = info.view.type;
        viewDate = viewType === "timeGridDay" ? info.startStr.slice(0, 10) : "";
        if (ready) onViewChange();
      }
    });

    calendar.render();

    // ---------- AKEN (modal) ----------
    const modal = document.getElementById("modal");
    const modalText = document.getElementById("modal-text");
    const modalTime = document.getElementById("modal-time");
    const modalTitle = document.getElementById("modal-title");

    function openModal(dateStr) {
      modalDate = dateStr;
      const [y, m, d] = dateStr.split("-");
      modalTitle.textContent = "Uus ülesanne: " + d + "." + m + "." + y;
      modalText.value = "";
      modalTime.value = "";
      modal.hidden = false;
      modalText.focus();
    }

    function closeModal() {
      modal.hidden = true;
    }

    async function saveModal() {
      const value = modalText.value.trim();
      if (!value) return;
      const time = readTime(modalTime);
      if (time === null) {
        alert("Vigane kellaaeg. Kirjuta kellaaeg kujul TT:MM, nt 14:30.");
        return;
      }
      try {
        const color = todoColor.value;
        const todo = withColor(await api("/api/todos", "POST", {
          text: value,
          date: modalDate,
          time: time,
          color: color
        }), color);
        todos.push(todo);
        refresh();
        closeModal();
      } catch (e) {
        alert("Ülesande salvestamine ebaõnnestus.");
      }
    }

    document.getElementById("modal-save").onclick = saveModal;
    document.getElementById("modal-cancel").onclick = closeModal;
    modalText.addEventListener("keydown", (e) => {
      if (e.key === "Enter") saveModal();
      if (e.key === "Escape") closeModal();
    });
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    // ---------- TO DO LIST ----------
    const todoInput = document.getElementById("todo-text");
    const todoDate = document.getElementById("todo-date");
    const todoTime = document.getElementById("todo-time");
    const todoAddBtn = document.getElementById("todo-add");
    const todoList = document.getElementById("todo-list");
    const todoColor = setupColorPicker("todo-color-picker", "todo-color", TODO_PALETTE);

    function todayString() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + m + "-" + day;
    }
    todoDate.value = todayString();

    function formatWhen(todo) {
      if (!todo.date) return "";
      const [y, m, d] = todo.date.split("-");
      const wd = WD_ABBR[weekdayOf(todo.date)];
      return (wd ? wd + " " : "") + d + "." + m + "." + y + (todo.time ? " " + todo.time : "");
    }

    function sortedTodos() {
      return todos.slice().sort((a, b) => {
        if (!a.date && !b.date) return 0;
        if (!a.date) return 1;
        if (!b.date) return -1;
        const ka = a.date + " " + (a.time || "00:00");
        const kb = b.date + " " + (b.time || "00:00");
        return ka.localeCompare(kb);
      });
    }

    function onViewChange() {
      const heading = document.getElementById("todo-heading");
      if (viewDate) {
        todoDate.value = viewDate;
        busyDate.value = viewDate;
        heading.textContent = "To do · " + WD_FULL[weekdayOf(viewDate)] + " " + formatWhen({ date: viewDate }).slice(4);
      } else {
        todoDate.value = todayString();
        heading.textContent = "To do";
      }
      renderTodos();
    }

    function refresh() {
      renderTodos();
      calendar.refetchEvents();
    }

    function renderTodos() {
      todoList.innerHTML = "";

      const visible = sortedTodos().filter(t => !viewDate || t.date === viewDate);

      if (viewDate && visible.length === 0) {
        const empty = document.createElement("li");
        empty.textContent = "Sellel päeval ülesandeid pole.";
        empty.style.color = "#78909c";
        todoList.appendChild(empty);
      }

      visible.forEach(todo => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.onchange = async () => {
          try {
            await api("/api/todos/" + todo.id + "/toggle", "POST", { done: checkbox.checked });
            todo.done = checkbox.checked;
          } catch (e) {
            checkbox.checked = todo.done;
          }
          refresh();
        };

        const body = document.createElement("div");
        body.className = "todo-body";

        const text = document.createElement("span");
        text.className = "todo-text";
        text.textContent = todo.text;
        body.appendChild(text);

        const when = formatWhen(todo);
        if (when) {
          const whenEl = document.createElement("span");
          whenEl.className = "todo-when";
          whenEl.textContent = when;
          body.appendChild(whenEl);
        }

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "×";
        del.onclick = async () => {
          try {
            await api("/api/todos/" + todo.id + "/delete", "POST");
            todos = todos.filter(t => t.id !== todo.id);
            refresh();
          } catch (e) {
            alert("Kustutamine ebaõnnestus.");
          }
        };

        const dot = document.createElement("span");
        dot.className = "color-dot";
        dot.style.background = safeColor(todo.color, DEFAULT_TODO_COLOR);

        li.classList.add("clickable");
        li.title = "Vajuta muutmiseks";
        li.onclick = (e) => {
          if (e.target.closest("button, input")) return;
          openEdit("todo", todo.id);
        };

        li.append(checkbox, dot, body, del);
        todoList.appendChild(li);
      });

      updateHints();
      renderUpcoming();
    }

    async function addTodo() {
      const value = todoInput.value.trim();
      if (!value) return;
      const time = readTime(todoTime);
      if (time === null) {
        alert("Vigane kellaaeg. Kirjuta kellaaeg kujul TT:MM, nt 14:30.");
        return;
      }

      try {
        const color = todoColor.value;
        const todo = withColor(await api("/api/todos", "POST", {
          text: value,
          date: todoDate.value,
          time: todoDate.value ? time : "",
          color: color
        }), color);
        todos.push(todo);
        todoInput.value = "";
        todoTime.value = "";
        todoDate.value = viewDate || todayString();
        refresh();
      } catch (e) {
        alert("Ülesande salvestamine ebaõnnestus.");
      }
    }

    todoAddBtn.onclick = addTodo;
    todoInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTodo();
    });

    // ---------- HÕIVATUD AEG (tunniplaan) ----------
    const busyList = document.getElementById("busy-list");
    const busyText = document.getElementById("busy-text");
    const busyDay = document.getElementById("busy-day");
    const busyStart = document.getElementById("busy-start");
    const busyEnd = document.getElementById("busy-end");
    const busyRepeat = document.getElementById("busy-repeat");
    const busyDate = document.getElementById("busy-date");
    busyDate.value = todayString();
    const todoWeekday = document.getElementById("todo-weekday");
    const busyWeekday = document.getElementById("busy-weekday");
    const busyColor = setupColorPicker("busy-color-picker", "busy-color", BUSY_PALETTE);

    function updateBusyRepeat() {
      busyDay.hidden = !busyRepeat.checked;
      busyDate.hidden = busyRepeat.checked;
      busyWeekday.hidden = busyRepeat.checked;
      updateHints();
    }
    busyRepeat.onchange = updateBusyRepeat;
    updateBusyRepeat();
    const DAY_NAMES = WD_ABBR;
    const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];

    function renderBusy() {
      busyList.innerHTML = "";

      busy
        .slice()
        .sort((a, b) => {
          const aOne = isOneOff(a);
          const bOne = isOneOff(b);
          if (aOne !== bOne) return aOne ? 1 : -1;       // iganädalased enne
          if (aOne) return (a.date + a.start).localeCompare(b.date + b.start);
          return DAY_ORDER.indexOf(a.day) - DAY_ORDER.indexOf(b.day) ||
                 a.start.localeCompare(b.start);
        })
        .forEach(b => {
          const li = document.createElement("li");

          const body = document.createElement("div");
          body.className = "todo-body";

          const text = document.createElement("span");
          text.className = "todo-text";
          text.textContent = b.text;

          const when = document.createElement("span");
          when.className = "todo-when";
          when.textContent = isOneOff(b)
            ? formatWhen({ date: b.date }) + " " + b.start + "–" + b.end
            : DAY_NAMES[b.day] + " " + b.start + "–" + b.end + " · iga nädal";

          body.append(text, when);

          const del = document.createElement("button");
          del.className = "delete";
          del.textContent = "×";
          del.onclick = async () => {
            try {
              await api("/api/busy/" + b.id + "/delete", "POST");
              busy = busy.filter(x => x.id !== b.id);
              renderBusy();
              calendar.refetchEvents();
            } catch (e) {
              alert("Kustutamine ebaõnnestus.");
            }
          };

          const dot = document.createElement("span");
          dot.className = "color-dot";
          dot.style.background = safeColor(b.color, DEFAULT_BUSY_COLOR);

          li.classList.add("clickable");
          li.title = "Vajuta muutmiseks";
          li.onclick = (e) => {
            if (e.target.closest("button, input")) return;
            openEdit("busy", b.id);
          };

          li.append(dot, body, del);
          busyList.appendChild(li);
        });

      updateHints();
      renderUpcoming();
    }

    async function addBusy() {
      const text = busyText.value.trim();
      const repeat = busyRepeat.checked;
      const date = busyDate.value;
      const day = repeat ? Number(busyDay.value) : new Date(date + "T00:00:00").getDay();
      const start = readTime(busyStart);
      const end = readTime(busyEnd);

      if (start === null || end === null) {
        alert("Vigane kellaaeg. Kirjuta kellaaeg kujul TT:MM, nt 14:30.");
        return;
      }
      if (!text || !start || !end) {
        alert("Täida nimi ja kellaajad.");
        return;
      }
      if (!repeat && !date) {
        alert("Vali kuupäev.");
        return;
      }
      if (end <= start) {
        alert("Lõpp peab olema pärast algust.");
        return;
      }

      try {
        const color = busyColor.value;
        const b = withColor(await api("/api/busy", "POST", { text, day, start, end, repeat, date: repeat ? "" : date, color }), color);
        busy.push(b);
        busyText.value = "";
        renderBusy();
        calendar.refetchEvents();
      } catch (e) {
        alert("Salvestamine ebaõnnestus.");
      }
    }

    document.getElementById("busy-add").onclick = addBusy;
    busyText.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addBusy();
    });

    async function loadBusy() {
      try {
        busy = await api("/api/busy", "GET");
      } catch (e) {
        busy = [];
      }
      renderBusy();
      calendar.refetchEvents();
    }

    // ---------- NÄDALAPÄEVA VIHJE KUUPÄEVA ALL ----------
    const editDate = document.getElementById("edit-date");
    const editWeekday = document.getElementById("edit-weekday");

    function updateHints() {
      function hint(input, el) {
        el.textContent = input.value ? (WD_FULL[weekdayOf(input.value)] || "") : "";
      }
      hint(todoDate, todoWeekday);
      hint(busyDate, busyWeekday);
      hint(document.getElementById("edit-date"), document.getElementById("edit-weekday"));
    }
    todoDate.addEventListener("input", updateHints);
    busyDate.addEventListener("input", updateHints);
    editDate.addEventListener("input", updateHints);

    // ---------- ÜLESANDE / HÕIVATUD AJA MUUTMINE ----------
    const editModal = document.getElementById("edit");
    const editTitle = document.getElementById("edit-title");
    const editText = document.getElementById("edit-text");
    const editError = document.getElementById("edit-error");
    const editTodoFields = document.getElementById("edit-todo-fields");
    const editBusyFields = document.getElementById("edit-busy-fields");
    const editTime = document.getElementById("edit-time");
    const editRepeat = document.getElementById("edit-repeat");
    const editDay = document.getElementById("edit-day");
    const editBusyDate = document.getElementById("edit-busy-date");
    const editStart = document.getElementById("edit-start");
    const editEnd = document.getElementById("edit-end");
    const editTodoColor = setupColorPicker("edit-todo-color-picker", "edit-todo-color", TODO_PALETTE);
    const editBusyColor = setupColorPicker("edit-busy-color-picker", "edit-busy-color", BUSY_PALETTE);
    let editing = null;                 // { kind: "todo" | "busy", id }

    function setPickerColor(input, value, fallback) {
      input.value = safeColor(value, fallback);
      input.dispatchEvent(new Event("input"));
    }

    function updateEditRepeat() {
      editDay.hidden = !editRepeat.checked;
      editBusyDate.hidden = editRepeat.checked;
    }
    editRepeat.onchange = updateEditRepeat;

    function openEdit(kind, id) {
      const item = (kind === "todo" ? todos : busy).find(x => String(x.id) === String(id));
      if (!item) return;
      editing = { kind: kind, id: item.id };
      editError.textContent = "";
      editText.value = item.text;
      editTodoFields.hidden = kind !== "todo";
      editBusyFields.hidden = kind !== "busy";

      if (kind === "todo") {
        editTitle.textContent = "Muuda ülesannet";
        editDate.value = item.date || "";
        editTime.value = item.time || "";
        setPickerColor(editTodoColor, item.color, DEFAULT_TODO_COLOR);
      } else {
        editTitle.textContent = "Muuda hõivatud aega";
        editRepeat.checked = !isOneOff(item);
        editDay.value = String(item.day);
        editBusyDate.value = item.date || todayString();
        editStart.value = item.start;
        editEnd.value = item.end;
        setPickerColor(editBusyColor, item.color, DEFAULT_BUSY_COLOR);
        updateEditRepeat();
      }
      [editTime, editStart, editEnd].forEach(i => i.classList.remove("invalid"));
      updateHints();
      editModal.hidden = false;
      editText.focus();
    }

    function closeEdit() {
      editModal.hidden = true;
      editing = null;
    }

    function editFail(message) {
      editError.textContent = message;
    }

    async function saveEdit() {
      if (!editing) return;
      const text = editText.value.trim();
      if (!text) return editFail("Nimi ei tohi olla tühi.");

      if (editing.kind === "todo") {
        const date = editDate.value;
        const time = readTime(editTime);
        if (time === null) return editFail("Vigane kellaaeg. Kirjuta kellaaeg kujul TT:MM, nt 14:30.");
        if (time && !date) return editFail("Kellaajaga ülesandel peab olema kuupäev.");
        const color = editTodoColor.value;
        try {
          const updated = withColor(await api("/api/todos/" + editing.id + "/update", "POST",
            { text, date, time: date ? time : "", color }), color);
          const item = todos.find(t => t.id === editing.id);
          if (item) Object.assign(item, updated);
          refresh();
          closeEdit();
        } catch (e) {
          editFail("Salvestamine ebaõnnestus.");
        }
        return;
      }

      const repeat = editRepeat.checked;
      const date = editBusyDate.value;
      const start = readTime(editStart);
      const end = readTime(editEnd);
      if (start === null || end === null) return editFail("Vigane kellaaeg. Kirjuta kellaaeg kujul TT:MM, nt 14:30.");
      if (!start || !end) return editFail("Täida algus- ja lõppkellaaeg.");
      if (!repeat && !date) return editFail("Vali kuupäev.");
      if (end <= start) return editFail("Lõpp peab olema pärast algust.");
      const day = repeat ? Number(editDay.value) : weekdayOf(date);
      const color = editBusyColor.value;
      try {
        const updated = withColor(await api("/api/busy/" + editing.id + "/update", "POST",
          { text, day, start, end, repeat, date: repeat ? "" : date, color }), color);
        const item = busy.find(b => b.id === editing.id);
        if (item) Object.assign(item, updated);
        renderBusy();
        calendar.refetchEvents();
        closeEdit();
      } catch (e) {
        editFail("Salvestamine ebaõnnestus.");
      }
    }

    async function deleteEdit() {
      if (!editing) return;
      const what = editing.kind === "todo" ? "ülesande" : "hõivatud aja";
      if (!confirm("Kas kustutan selle " + what + "?")) return;
      try {
        if (editing.kind === "todo") {
          await api("/api/todos/" + editing.id + "/delete", "POST");
          todos = todos.filter(t => t.id !== editing.id);
          refresh();
        } else {
          await api("/api/busy/" + editing.id + "/delete", "POST");
          busy = busy.filter(b => b.id !== editing.id);
          renderBusy();
          calendar.refetchEvents();
        }
        closeEdit();
      } catch (e) {
        editFail("Kustutamine ebaõnnestus.");
      }
    }

    document.getElementById("edit-delete").onclick = deleteEdit;
    document.getElementById("edit-save").onclick = saveEdit;
    document.getElementById("edit-cancel").onclick = closeEdit;
    editModal.addEventListener("click", (e) => {
      if (e.target === editModal) closeEdit();
    });
    editModal.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeEdit();
      if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type === "text") saveEdit();
    });

    // ---------- LÄHIAJA TEATED (kast all vasakul) ----------
    const upcomingBox = document.getElementById("upcoming");
    const upcomingList = document.getElementById("upcoming-list");
    const upcomingTitle = document.getElementById("upcoming-title");
    const upcomingToggle = document.getElementById("upcoming-toggle");

    const UPCOMING_HOURS = 24;     // kui kaugele ette sündmusi näidatakse
    const SOON_MINUTES = 60;       // nii lähedal olevad tõstetakse esile
    const UPCOMING_MAX = 6;        // nii palju rida korraga (ülejäänud: "+ N veel")

    function dateKey(d) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    // "2026-10-22" + "14:30" -> Date (kohalik aeg)
    function parseLocal(dateStr, timeStr) {
      const d = String(dateStr || "").split("-").map(Number);
      const t = String(timeStr || "00:00").split(":").map(Number);
      return new Date(d[0], d[1] - 1, d[2], t[0], t[1] || 0, 0, 0);
    }

    // Kõik, mis algab järgmise 24 tunni jooksul (või on praegu käimas)
    function collectUpcoming(now) {
      const limit = new Date(now.getTime() + UPCOMING_HOURS * 3600 * 1000);
      const today = dateKey(now);
      const items = [];

      todos.forEach(function (t) {
        if (t.done || !t.date) return;
        const start = parseLocal(t.date, t.time || "00:00");
        if (isNaN(start.getTime())) return;
        const color = safeColor(t.color, DEFAULT_TODO_COLOR);
        if (t.time) {
          if (start >= now && start <= limit) items.push({ text: t.text, start: start, color: color });
        } else if (t.date === today || (start > now && start <= limit)) {
          items.push({ text: t.text, start: start, allDay: true, color: color });   // terve päeva ülesanne
        }
      });

      busy.forEach(function (b) {
        const dates = [];
        if (isOneOff(b)) {
          if (b.date) dates.push(b.date);
        } else {
          for (let i = 0; i <= 1; i++) {                                           // täna ja homme
            const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
            if (d.getDay() === Number(b.day)) dates.push(dateKey(d));
          }
        }
        const color = safeColor(b.color, DEFAULT_BUSY_COLOR);
        dates.forEach(function (dateStr) {
          const start = parseLocal(dateStr, b.start);
          const end = parseLocal(dateStr, b.end);
          if (isNaN(start.getTime()) || isNaN(end.getTime())) return;
          if (now >= start && now < end) {
            items.push({ text: b.text, start: start, end: end, ongoing: true, color: color });
          } else if (start >= now && start <= limit) {
            items.push({ text: b.text, start: start, color: color });
          }
        });
      });

      // kellaajaga sündmused ajajärjekorras, terve päeva ülesanded nende järel
      return items.sort(function (a, b) {
        return (a.allDay ? 1 : 0) - (b.allDay ? 1 : 0) || a.start - b.start;
      });
    }

    function inText(ms) {
      const min = Math.round(ms / 60000);
      if (min < 1) return "kohe";
      if (min < 60) return min + " min pärast";
      const h = Math.floor(min / 60);
      const m = min % 60;
      return h + " h" + (m ? " " + m + " min" : "") + " pärast";
    }

    function hhmm(d) {
      return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }

    function dayWord(d, now) {
      const key = dateKey(d);
      if (key === dateKey(now)) return "Täna";
      if (key === dateKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1))) return "Homme";
      return formatWhen({ date: key });
    }

    function whenText(item, now) {
      if (item.ongoing) return "Käimas · lõpeb " + hhmm(item.end) + " (" + inText(item.end - now) + ")";
      if (item.allDay) return dayWord(item.start, now) + " · terve päev";
      return dayWord(item.start, now) + " " + hhmm(item.start) + " · " + inText(item.start - now);
    }

    function renderUpcoming() {
      const now = new Date();
      const items = collectUpcoming(now);

      upcomingList.innerHTML = "";
      if (items.length === 0) {
        upcomingBox.hidden = true;
        document.body.classList.remove("has-upcoming");
        return;
      }
      upcomingBox.hidden = false;
      document.body.classList.add("has-upcoming");
      upcomingTitle.textContent = "Lähiajal · " + items.length;

      items.slice(0, UPCOMING_MAX).forEach(function (item) {
        const li = document.createElement("li");
        if (!item.allDay && !item.ongoing && item.start - now <= SOON_MINUTES * 60000) li.classList.add("soon");

        const dot = document.createElement("span");
        dot.className = "color-dot";
        dot.style.background = item.color;

        const body = document.createElement("div");
        body.className = "upcoming-body";

        const text = document.createElement("span");
        text.className = "upcoming-text";
        text.textContent = item.text;

        const when = document.createElement("span");
        when.className = "upcoming-when";
        when.textContent = whenText(item, now);

        body.append(text, when);
        li.append(dot, body);
        upcomingList.appendChild(li);
      });

      if (items.length > UPCOMING_MAX) {
        const more = document.createElement("li");
        more.className = "more";
        more.textContent = "+ " + (items.length - UPCOMING_MAX) + " veel";
        upcomingList.appendChild(more);
      }
    }

    // Kasti saab peita; valik jääb meelde (kui brauser lubab)
    function setUpcomingCollapsed(collapsed) {
      upcomingBox.classList.toggle("collapsed", collapsed);
      upcomingToggle.textContent = collapsed ? "+" : "–";
      try { localStorage.setItem("upcomingCollapsed", collapsed ? "1" : "0"); } catch (e) { /* pole oluline */ }
    }
    upcomingToggle.onclick = function () {
      setUpcomingCollapsed(!upcomingBox.classList.contains("collapsed"));
    };
    try { if (localStorage.getItem("upcomingCollapsed") === "1") setUpcomingCollapsed(true); } catch (e) { /* pole oluline */ }

    // uuenda iga 30 sekundi tagant, et "N min pärast" püsiks õige
    setInterval(renderUpcoming, 30000);

    // ---------- ALGLAADIMINE ----------
    async function loadTodos() {
      try {
        todos = await api("/api/todos", "GET");
      } catch (e) {
        todos = [];
      }
      refresh();
    }
    loadTodos();
    loadBusy();
    ready = true;
  </script>

</body>

</html>
